        <rect x="275" y="1018" width="6" height="20"/><rect x="284" y="1018" width="2" height="20"/><rect x="288" y="1018" width="3" height="20"/><rect x="294" y="1018" width="5" height="20"/>
        <rect x="302" y="1018" width="2" height="20"/><rect x="306" y="1018" width="3" height="20"/><rect x="312" y="1018" width="2" height="20"/><rect x="316" y="1018" width="6" height="20"/>

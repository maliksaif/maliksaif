<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-label="Saif wallet card: 9+ years balance, no expiry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1f2a44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d77a"/>
      <stop offset="1" stop-color="#c9953a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="380" rx="26" fill="url(#bg)"/>
  <circle cx="560" cy="40" r="170" fill="#3b82f6" opacity="0.08"/>
  <circle cx="610" cy="350" r="130" fill="#10b981" opacity="0.08"/>
  <rect width="640" height="380" rx="26" fill="url(#shine)"/>

  <g font-family="Helvetica, Arial, sans-serif" fill="#e5e9f2">
    <text x="40" y="58" font-size="15" font-weight="700" letter-spacing="4">SAIF WALLET</text>
    <text x="600" y="58" font-size="12" letter-spacing="3" text-anchor="end" fill="#94a3b8">FULL STACK ENGINEER</text>

    <!-- chip -->
    <rect x="40" y="96" width="70" height="52" rx="9" fill="url(#gold)"/>
    <path d="M40 122h70M75 96v52M58 96v16q0 10-10 10M92 96v16q0 10 10 10M58 148v-16q0-10-10-10M92 148v-16q0-10 10-10" stroke="#8a5f17" stroke-width="1.4" fill="none" opacity="0.7"/>
    <!-- contactless -->
    <g fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round">
      <path d="M132 112q10 14 0 28"/>
      <path d="M144 106q15 20 0 40"/>
      <path d="M156 100q20 26 0 52"/>
    </g>

    <text x="40" y="206" font-size="11" letter-spacing="3" fill="#94a3b8">BALANCE</text>
    <text x="40" y="254" font-size="46" font-weight="700">9+ YEARS</text>
    <text x="40" y="278" font-size="12" fill="#94a3b8">of shipped software, compounding</text>

    <text x="600" y="206" font-size="11" letter-spacing="3" text-anchor="end" fill="#94a3b8">ASSETS</text>
    <text x="600" y="232" font-size="14" text-anchor="end">Android  iOS  Wear OS</text>
    <text x="600" y="254" font-size="14" text-anchor="end">React Native  Flutter</text>
    <text x="600" y="276" font-size="14" text-anchor="end">Azure  GCP  BLE  POS</text>

    <line x1="40" y1="306" x2="600" y2="306" stroke="#334155"/>
    <text x="40" y="338" font-size="11" letter-spacing="3" fill="#94a3b8">HOLDER</text>
    <text x="40" y="360" font-size="16" font-weight="700" letter-spacing="2">SAIF M</text>
    <text x="600" y="338" font-size="11" letter-spacing="3" text-anchor="end" fill="#94a3b8">VALID THRU</text>
    <text x="600" y="360" font-size="16" font-weight="700" letter-spacing="2" text-anchor="end">NO EXPIRY</text>
  </g>
</svg>
